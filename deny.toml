# WyattAu dependency governance — cargo-deny configuration.
# Copy to the repo root. Policies: see engineering-standards README §7.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # rustls-pemfile unmaintained. Transitive via sqlx rustls stack; the
    # ecosystem migration to rustls-pki-types has not landed in sqlx yet.
    "RUSTSEC-2025-0134",
    # rsa Marvin Attack (timing sidechannel). Transitive via sqlx-postgres
    # SCRAM auth; no fixed rsa release exists upstream. Revisit when
    # RUSTSEC-2023-0071 gains a patched version.
    "RUSTSEC-2023-0071",
    # tokio-tar PAX header file-smuggling. Reached only through the
    # optional `testcontainers` feature (dev/CI integration suites),
    # never in the published poolkit artifact. No fixed release exists.
    "RUSTSEC-2025-0111",
    # time stack-exhaustion DoS (serde_with -> testcontainers/sqlx).
    # Patched in time >=0.3.47 but that requires rustc 1.88 vs this
    # crate's MSRV 1.85. Revisit at the next MSRV bump.
    "RUSTSEC-2026-0009",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
