[package]
name = "poolkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Database connection pooling for Rust — SQLx wrapper with health checks, lazy connections, test containers, and metrics"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/poolkit"
keywords = ["database", "pool", "sqlx", "connection", "async"]
categories = ["database", "asynchronous"]

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls"] }
tokio = { version = "1", features = ["rt", "macros"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[dependencies.sqlx-postgres]
version = "0.8"
optional = true

[dependencies.sqlx-sqlite]
version = "0.8"
optional = true

[dependencies.testcontainers]
version = "0.23"
optional = true

[features]
default = ["postgres"]
postgres = ["sqlx-postgres"]
sqlite = ["sqlx-sqlite"]
testcontainers = ["dep:testcontainers"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
