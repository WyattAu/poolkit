[package]
name = "poolkit"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Database connection pooling for Rust — SQLx wrapper with health checks, lazy connections, test containers, and metrics"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/poolkit"
keywords = ["database", "pool", "sqlx", "connection", "async"]
categories = ["database", "asynchronous"]
exclude = ["/target"]

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[features]
default = ["postgres"]
# Driver features must come from the `sqlx` facade itself: `sqlx::any`
# registers drivers compiled into the facade (`install_default_drivers`),
# and standalone `sqlx-postgres`/`sqlx-sqlite` deps would not register
# anything.
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[dev-dependencies]
serde_json = "1"
# sqlite_pool.rs: on-disk databases in a tempdir.
tempfile = "3"
# postgres_pool.rs: a throwaway Postgres per test run (docker).
testcontainers = "0.23"
testcontainers-modules = { version = "0.12", features = ["postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[[test]]
name = "sqlite_pool"
required-features = ["sqlite"]

[[test]]
name = "postgres_pool"
required-features = ["postgres"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
